def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// यहाँ है असली समाधान
def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    // GitHub Actions के लिए ये लाइन रामबाण है
    flutterRoot = System.getenv('FLUTTER_HOME') 
}

if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in local.properties or FLUTTER_HOME env variable.")
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// यहाँ .gradle की जगह .groovy करके देखो, क्योंकि 3.13.0 में Groovy ही असली इंजन है
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.groovy"

android {
    namespace "com.example.balaji"
    compileSdkVersion 34
    // ... बाकी सब वैसा ही रहने दें ...
}

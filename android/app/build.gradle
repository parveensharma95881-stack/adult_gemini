apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.example.adult_gemini"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.adult_gemini"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // ये दो लाइनें कतई ज़रूरी हैं ताकि 'BackEvent' वाला एरर न आए
            minifyEnabled false
            shrinkResources false
            
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source flutterRoot
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"  // ये कतई सही रास्ता है
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.adult_gemini"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

        sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.java.srcDirs += 'src/main/java' // ये भी जोड़ दे ताकि कोई गुंजाइश न रहे
    }

    defaultConfig {
        applicationId "com.example.adult_gemini"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    // बाकी जो हमने मैन्युअली डाला था (io.flutter वाली लाइन), उसे हटा दे
}

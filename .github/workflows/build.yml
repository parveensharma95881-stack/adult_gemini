name: Build Balaji APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # GitHub Actions के लेटेस्ट वर्जन (Node 20 सपोर्टेड)
      - uses: actions/checkout@v4 
      
      - name: Set up Java
        uses: actions/setup-java@v4 # v4 इस्तेमाल करें (Node 20 के लिए बेहतर)
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # पुरानी फाइलों का लफड़ा खत्म करने के लिए सफाई
      - name: Clean Project
        run: |
          flutter clean
          rm -rf pubspec.lock

      - name: Install dependencies
        run: flutter pub get

      # यहाँ हमने वो ब्रह्मास्त्र लगाया है जो R8 के एरर को बाईपास करेगा
      - name: Build APK (R8 Bypass Mode)
        run: flutter build apk --release --no-tree-shake-icons --no-minify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: balaji-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

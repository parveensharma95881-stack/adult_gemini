pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = file("local.properties")
        
        // अगर फाइल है (लोकल कंप्यूटर पर) तो वहां से उठाओ
        if (propertiesFile.exists()) {
            propertiesFile.withInputStream { properties.load(it) }
            return properties.getProperty("flutter.sdk")
        } 
        // अगर फाइल नहीं है (GitHub Actions पर) तो यहाँ से उठाओ
        else {
            return System.getenv('FLUTTER_HOME') ?: System.getenv('FLUTTER_ROOT')
        }
    }()

    // अगर ऊपर से रास्ता मिल गया तो ठीक, वरना ये डिफ़ॉल्ट रास्ता (GitHub वाला)
    if (flutterSdkPath == null) {
        flutterSdkPath = '/opt/hostedtoolcache/flutter/stable-3.13.0-x64/flutter'
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    id "com.android.application" version "7.4.2" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"

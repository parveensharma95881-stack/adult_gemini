def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// यहाँ है असली खेल
def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    // GitHub Actions के एनवायरनमेंट से रास्ता उठाना
    flutterRoot = System.getenv('FLUTTER_HOME') ?: System.getenv('FLUTTER_ROOT')
}

// अगर फिर भी न मिले, तो एरर न दे बल्कि यहाँ से रास्ता उठाए
if (flutterRoot == null) {
   flutterRoot = '/opt/hostedtoolcache/flutter/stable-3.13.0-x64/flutter'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
// यहाँ से Flutter का असली इंजन लोड होगा
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.groovy"

android {
    namespace "com.example.balaji"
    compileSdkVersion 34
    // ... बाकी कोड वैसा ही ...
}

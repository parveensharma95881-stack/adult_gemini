plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android" // इसे ऐसे बदल दे
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.balaji" // तेरा नया नाम
    compileSdk 34
    
    // ये कोडिंग कतई नहीं भूलनी
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    // बाकी कोडिंग जो तूने पहले डाली थी...
}

buildscript {
    ext.kotlin_version = '1.9.10' // इसे 1.9.10 कर दे
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0' // इसे भी चेक कर ले
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// इसके नीचे कुछ नहीं होना चाहिए! सारा android { } वाला कोड अंदर वाली फाइल में रहेगा।
rootProject.buildDir = '../build'
subprojects
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

- name: Reset Packages
  run: |
    rm -f pubspec.lock
    flutter clean
    flutter pub get

# 🚀 Node 20 की चेतावनी को जड़ से खत्म करने के लिए
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # यहाँ वर्जन 3.24.0 किया है ताकि Dart 3.7.0 मिले और 'test_api' वाला एरर खत्म हो
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Balaji-App-Final-No-Errors
          path: build/app/outputs/flutter-apk/app-release.apk

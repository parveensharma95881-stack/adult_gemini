<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सेवक श्री मेहंदीपुर बालाजी कैलेंडर</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fff5e6; color: #800000; text-align: center; }
        .header { background: #ff4500; color: white; padding: 15px; font-size: 24px; font-weight: bold; border-bottom: 5px solid #ffd700; }
        .calendar-container { margin: 20px; border: 2px solid #ff4500; border-radius: 10px; background: white; overflow: hidden; }
        iframe { width: 100%; height: 600px; border: none; }
        .bhakti-quote { padding: 10px; font-style: italic; color: #ff4500; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">।। जय श्री राम ।।<br>सेवक श्री मेहंदीपुर बालाजी महाराज पंचांग</div>
    <div class="bhakti-quote">"बालाजी महाराज की कृपा से आपका हर दिन मंगलमय हो"</div>
    
    <div class="calendar-container">
        <iframe src="https://www.prokerala.com/hindi/calendar/"></iframe>
    </div>

    <script>
        // यहाँ हम साल 2050 तक का सेलेक्टर लॉजिक भी डाल सकते हैं
        console.log("बालाजी महाराज कैलेंडर सक्रिय है");
    </script>
</body>
</html>

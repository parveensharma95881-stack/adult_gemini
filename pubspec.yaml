name: adult_gemini
description: "Sevak Shri Mehandipur Balaji App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- यहाँ से सभी अपडेटेड और मिक्स पैकेजेस हैं ---
  cupertino_icons: ^1.0.9
  battery_plus: ^7.0.0
  flutter_inappwebview: ^6.1.5
  clock: ^1.1.2
  
  dev_dependencies:
  flutter_test:
    sdk: flutter
    
  
  # टेस्टिंग और लिंट्स के लेटेस्ट वर्जन
  flutter_lints: ^6.0.0
  lints: ^6.1.0
  test_api: ^0.7.10
  fake_async: ^1.3.3
  boolean_selector: ^2.1.2
  leak_tracker: ^11.0.2
  leak_tracker_flutter_testing: ^3.0.10
  leak_tracker_testing: ^3.0.2

flutter:
  uses-material-design: true
  # तेरा पंचांग डेटाबेस यहाँ सुरक्षित है
  assets:
    - assets/database/panchang.db

name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

        steps:
      - uses: actions/checkout@v4 # वर्जन 4 इस्तेमाल करें
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # या जो आप इस्तेमाल कर रहे हैं
          channel: 'stable'

        

      - name: Install dependencies
        run: flutter pub get

      - name: Install dependencies
        run: flutter pub get

      # अगर कोटलिन में कोई छोटी-मोटी गड़बड़ है तो ये उसे साफ़ कर देगा
      - name: Clear Pub Cache
        run: flutter pub cache clean

      - name: Force Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      

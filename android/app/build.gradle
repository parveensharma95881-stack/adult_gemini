def flutterRoot = System.getenv('FLUTTER_ROOT') ?: ""
if (flutterRoot == "") {
    def sdkPath = ""
    def propertiesFile = new File(rootProject.projectDir, "local.properties")
    if (propertiesFile.exists()) {
        propertiesFile.withReader('UTF-8') { reader ->
            def properties = new Properties()
            properties.load(reader)
            sdkPath = properties.getProperty('flutter.sdk')
        }
    }
    flutterRoot = sdkPath
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.example.adult_gemini"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.adult_gemini"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // R8 और BackEvent वाले एरर को रोकने के लिए
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source flutterRoot
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
